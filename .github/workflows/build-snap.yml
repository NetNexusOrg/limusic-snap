name: Build Snap

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "snap/**"
      - "scripts/**"
      - ".github/workflows/build-snap.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      upstream_tag:
        description: Upstream tag to bump to before building (for example v1.5.0)
        required: false
        type: string
      upstream_ref:
        description: Upstream branch to build from instead of a tag (dev or master)
        required: false
        type: string
      artifact_suffix:
        description: Suffix for the uploaded artifact name, for example -edge
        required: false
        type: string
    outputs:
      snap:
        description: File name of the built snap
        value: ${{ jobs.build.outputs.snap }}
      version:
        description: Packaging version that was built
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  # The suffix keeps the four matrix legs of upstream-release.yml in separate
  # groups; without it they share github.workflow/github.ref and cancel each
  # other. Direct push and pull request builds have an empty suffix.
  group: snap-${{ github.workflow }}-${{ github.ref }}-${{ inputs.artifact_suffix }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      snap: ${{ steps.package.outputs.snap }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare the upstream source
        if: inputs.upstream_tag != ''
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ./scripts/bump-upstream.sh "$UPSTREAM_TAG"
          else
            ./scripts/prepare-prerelease.sh "$UPSTREAM_TAG"
          fi

      - name: Switch to the upstream branch
        if: inputs.upstream_ref != ''
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: ./scripts/switch-to-ref.sh "$UPSTREAM_REF"

      - name: Set up LXD
        uses: canonical/setup-lxd@v1

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Configure Last.fm credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "${LASTFM_API_KEY}" ] && [ -n "${LASTFM_API_SECRET}" ]; then
            umask 077
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > snap/local/lastfm.keys
            echo "Last.fm credentials will be embedded in this build."
          else
            echo "::warning title=Last.fm not configured::LASTFM_API_KEY/LASTFM_API_SECRET secrets are missing; building without Last.fm support."
          fi

      - name: Build snap
        run: |
          sudo usermod -aG lxd "$USER"
          sg lxd -c 'snapcraft pack --use-lxd'

      - name: Lint snap
        run: |
          snap=$(ls limusic-community_*.snap | head -n1)
          snapcraft lint "$snap"

      - name: Generate checksum
        id: package
        run: |
          snap=$(ls limusic-community_*.snap | head -n1)
          sha256sum "$snap" > "$snap.sha256"
          cat "$snap.sha256"
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' snap/snapcraft.yaml | head -n1)
          echo "snap=$snap" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload snap and checksum
        uses: actions/upload-artifact@v4
        with:
          name: limusic-community-snap${{ inputs.artifact_suffix }}
          path: |
            limusic-community_*.snap
            limusic-community_*.snap.sha256
          if-no-files-found: error
          retention-days: 14
