name: limusic
title: Limusic
base: core24
version: "1.4.1-3"
grade: stable
confinement: strict
license: GPL-3.0-only
website: https://limusic.app
source-code: https://github.com/SimoHypers/limusic
contact: https://github.com/NetNexusOrg/limusic-snap
issues: https://github.com/NetNexusOrg/limusic-snap/issues
icon: snap/local/icon.png

summary: Unofficial Snap for Limusic, a desktop YouTube Music client
description: |
  Limusic is a feature-rich desktop YouTube Music client built with Tauri,
  Rust and SvelteKit. It supports streaming, local music, synced lyrics,
  music videos, media keys and desktop integration.

  This is an unofficial community Snap package. It is not affiliated with
  or endorsed by the upstream author. Limusic itself is developed by
  SimoHypers at https://github.com/SimoHypers/limusic and is licensed under
  GPL-3.0.

  The Snap builds upstream v1.4.1 and uses the system libmpv for playback.
  Updates are delivered by snapd; the in-app Tauri updater is disabled in
  this build.

platforms:
  amd64:

apps:
  limusic:
    extensions:
      - gnome
    command: bin/limusic-app
    desktop: usr/share/applications/limusic.desktop
    common-id: limusic
    plugs:
      - network
      - network-bind
      # WebKit asks the desktop portal for network/proxy status. The portal only
      # reports access when the snap has the network-status interface, so Google
      # login fails with portal.Error.NotAllowed without this marker plug.
      - network-status
      - audio-playback
      - home
      - removable-media
    slots:
      - mpris
      - single-instance

slots:
  mpris:
    interface: mpris
    name: limusic
  # The Tauri single-instance plugin owns this D-Bus name, derived from the
  # upstream app identifier com.limusic.desktop.
  single-instance:
    interface: dbus
    bus: session
    name: com.limusic.desktop.SingleInstance

parts:
  limusic:
    plugin: nil
    source: https://github.com/SimoHypers/limusic.git
    source-tag: v1.4.1
    build-snaps:
      - node/22/stable
    build-packages:
      - build-essential
      - pkg-config
      - curl
      - ca-certificates
      - libmpv-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - libdbus-1-dev
    stage-packages:
      - libmpv2
      # WebKitGTK plays music videos with GStreamer. The GNOME content snap
      # ships the base plugins but not libgstlibav, so H.264/AAC streams fail
      # without this. desktop-launch adds $SNAP/usr/lib/$ARCH/gstreamer-1.0 to
      # GST_PLUGIN_PATH, so the staged plugin is picked up automatically.
      - gstreamer1.0-libav
      # libsphinxbase3 (pulled in by libmpv2) links against BLAS/LAPACK, but
      # Snapcraft's dependency resolver does not stage the virtual providers.
      - libblas3
      - liblapack3
    override-pull: |
      set -eux
      craftctl default
      cd "$CRAFT_PART_SRC"
      for patch in disable-updater.patch pt-pt-locale.patch; do
        path="$CRAFT_PROJECT_DIR/snap/local/$patch"
        if git apply --check "$path"; then
          git apply "$path"
          echo "$patch applied"
        elif git apply --reverse --check "$path"; then
          echo "$patch already applied"
        else
          echo "$patch does not apply to this source tree" >&2
          exit 1
        fi
      done
    override-build: |
      set -eux
      cd "$CRAFT_PART_SRC"

      # Rust: upstream requires >= 1.80; use current stable.
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
      curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
        -o "$CRAFT_PART_BUILD/rustup-init.sh"
      sh "$CRAFT_PART_BUILD/rustup-init.sh" -y --profile minimal \
        --default-toolchain stable --no-modify-path
      export PATH="$CARGO_HOME/bin:$PATH"
      rustc --version
      cargo --version

      # Node 22 comes from the build snap; install the JS tools in a writable prefix.
      export NPM_CONFIG_PREFIX="$CRAFT_PART_BUILD/.npm-global"
      mkdir -p "$NPM_CONFIG_PREFIX"
      export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
      npm install --global pnpm@10 @tauri-apps/cli@2.11.5
      pnpm --version
      tauri --version

      # Optional Last.fm credentials. The file is gitignored and never committed.
      if [ -f "$CRAFT_PROJECT_DIR/snap/local/lastfm.keys" ]; then
        install -m 600 "$CRAFT_PROJECT_DIR/snap/local/lastfm.keys" \
          src-tauri/lastfm.keys
      fi

      # Build the SvelteKit UI first, then compile the Tauri backend.
      cd ui
      pnpm install --frozen-lockfile
      pnpm build
      # The pt-PT patch only matters if it reaches the built frontend. esbuild
      # escapes non-ASCII, so look for ASCII-only strings from the locale entry.
      for needle in "Portuguese (Portugal)" "pt-PT"; do
        if ! grep -rqs -- "$needle" build; then
          echo "pt-PT locale missing from ui/build ($needle)" >&2
          exit 1
        fi
      done
      cd ..

      tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'

      install -Dm755 target/release/limusic-app \
        "$CRAFT_PART_INSTALL/bin/limusic-app"

      install -Dm644 "$CRAFT_PROJECT_DIR/snap/local/limusic.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/limusic.desktop"
      install -Dm644 \
        "$CRAFT_PROJECT_DIR/snap/local/com.limusic.desktop.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/com.limusic.desktop.metainfo.xml"

      install -Dm644 src-tauri/icons/32x32.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/32x32/apps/limusic-app.png"
      install -Dm644 src-tauri/icons/64x64.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/64x64/apps/limusic-app.png"
      install -Dm644 src-tauri/icons/128x128.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/limusic-app.png"
      install -Dm644 src-tauri/icons/128x128@2x.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/limusic-app.png"
      install -Dm644 src-tauri/icons/icon.png \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/limusic-app.png"

      # libblas3/liblapack3 install into blas/ and lapack/ subdirectories and
      # rely on update-alternatives for the top-level soname symlinks. Snapcraft
      # does not run update-alternatives, so create the symlinks explicitly.
      libdir="$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      install -d "$libdir"
      ln -sfn blas/libblas.so.3 "$libdir/libblas.so.3"
      ln -sfn lapack/liblapack.so.3 "$libdir/liblapack.so.3"
